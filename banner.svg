<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1033"/>
      <stop offset="55%" stop-color="#3B1466"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="900" height="200" fill="url(#bg)"/>
    <g fill="#FFFFFF" opacity="0.08">
      <circle cx="60" cy="40" r="3"/><circle cx="120" cy="165" r="2"/><circle cx="210" cy="30" r="2"/>
      <circle cx="700" cy="40" r="3"/><circle cx="830" cy="160" r="2"/><circle cx="780" cy="110" r="2"/>
      <circle cx="400" cy="180" r="2"/><circle cx="560" cy="20" r="2"/>
    </g>
    <rect x="-300" y="0" width="300" height="200" fill="url(#shine)">
      <animate attributeName="x" from="-300" to="900" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">QA Engineer</text>
  </g>
</svg>
